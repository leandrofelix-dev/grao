services:
  grao:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      UPLOADS_DIR: /app/data/uploads
      PORT: 3000
    volumes:
      - ./data/uploads:/app/data/uploads
