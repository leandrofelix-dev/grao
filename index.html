<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="grão — galeria pessoal de fotos" />
    <title>grão</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <!--ssr-styles-->
  </head>
  <body>
    <script>
      (function () {
        try {
          var m = localStorage.getItem('grao-color-mode');
          if (m === 'light' || m === 'dark') {
            document.documentElement.dataset.colorMode = m;
            document.documentElement.style.colorScheme = m;
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"><!--ssr-outlet--></div>
    <!--ssr-data-->
    <script type="module" src="/src/frontend/entry-client.tsx"></script>
  </body>
</html>
